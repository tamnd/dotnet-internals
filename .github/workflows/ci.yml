name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read only by default, and a job that needs more says so itself. Nothing here writes to the
# repository, so a compromised action in a pull request cannot either.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The prose rules, run before anything expensive. Three of the rules a reviewer would
  # otherwise have to be the person who mentions, and a fourth that is the house style on
  # words that lie to a reader about how hard something is.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet run --project tools/xray -- lint

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet format ClrXray.slnx --verify-no-changes --severity warn

  # Four platforms, because a lesson verified on one is a lesson that prints a reduced platform
  # list on its own page. Two of them are arm64, which is where the codegen lessons stop being a
  # single listing and start being a comparison.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build ClrXray.slnx --configuration Release
      # The banner is the tool proving it can answer the question every lesson opens with. It
      # runs on all four platforms because the interesting part of the answer is the part that
      # differs between them, and a banner that only works on Linux would hide exactly that.
      - run: dotnet run --project tools/xray --configuration Release --no-build -- banner

  # The six step build, run cold, on the same four platforms. This job is the reason no number in a
  # lesson is typed by a person: it regenerates the output, the pictures, the blueprint sections and
  # every page from source, and fails if one byte of any of them differs from what is committed. A
  # pull request that edits lesson code and leaves the numbers alone dies here rather than in
  # review. The step names in the log say which of the six went red, which is the difference between
  # a lesson whose code is wrong and a lesson whose committed page is out of date.
  lessons:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # What this runner has, on the record, before anything is built with it. --require E0
      # rather than nothing, because a job that prints what it found and carries on regardless is
      # a job that goes green after quietly losing an environment. E0 is the only one the four
      # hosted runners are set up for today, and this is the line that changes when that changes.
      - run: dotnet run --project tools/xray -- env --require E0
      # No path, so it covers the whole repository: every lesson, every diagram and every
      # blueprint. Diagrams are generated from a text source too, so a picture cannot drift from
      # the page around it, and the blueprints are the specification half of the project whose
      # whole claim is that their tables are produced rather than transcribed.
      #
      # --offline skips the cite step, which is the only one that needs the network. It has a job
      # of its own that runs once rather than four times, because a citation resolves or does not
      # resolve and the answer does not depend on which machine asked.
      - run: dotnet run --project tools/xray -- check --offline

  # The citation gate, and the only job here that touches the network. Every citation on every
  # page is fetched from the repository it names at the commit it names, and the line it lands on
  # is printed into the log so a reviewer can see what was cited rather than that something was.
  # The second step is the one that matters while the pin has not landed: it proves the gate still
  # rejects a citation pinned to a branch, a line past the end of a file and a line that does not
  # say what the page claims, because a check that has never refused anything is not a check.
  cite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # The tool says where its cache is and what to call it, rather than the two being typed here
      # and drifting apart. The key carries the cache layout version, so changing the layout
      # abandons the old cache instead of restoring it into a tool that would misread it, and it
      # carries a hash of pin.json, because what this job is allowed to fetch is exactly what the
      # pin names. A pull request reads the cache that the last run on main saved.
      - id: cache
        run: |
          echo "path=$(dotnet run --project tools/xray -- cache path)" >> "$GITHUB_OUTPUT"
          echo "key=$(dotnet run --project tools/xray -- cache key --repository dotnet-internals --tag ${{ hashFiles('pin.json') }} --platform any --configuration any --name cite)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.cache.outputs.path }}
          key: ${{ steps.cache.outputs.key }}
      - run: dotnet run --project tools/xray -- cite
      - run: dotnet run --project tools/xray -- cite --selftest
      # What this job fetched, and where each thing came from, in the log. A cache is a set of
      # files a program wrote while nobody was looking, so the run that fills it is the run that
      # ought to say what went in.
      - run: dotnet run --project tools/xray -- cache list

  # The cache the job above depends on. It has the failure mode that does not turn anything red:
  # an entry that is still sitting there and is no longer what arrived, which every run after that
  # reads and believes. So the cases here are mostly about refusing, and the two that matter most
  # are an entry altered on disk and two keys that differ by one axis landing on top of each other.
  # None of it touches the network, so it runs anywhere.
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet run --project tools/xray -- cache --selftest

  # The gate behind the sentence the whole project rests on, which is that no number in a lesson is
  # typed by a person. It reads the lesson source rather than the generated page, and the rule with
  # teeth is the second one: a number that is already sitting in this lesson's own captured output
  # and was retyped into the prose anyway. The self test is here for the same reason the citation
  # one is, which is that a gate everything passes and a gate that does nothing look identical.
  numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet run --project tools/xray -- numbers lessons
      - run: dotnet run --project tools/xray -- numbers --selftest

  # The assertion checker. The assertions themselves are evaluated by the lessons job on all four
  # platforms, which is where they belong, because the whole point of one is that it holds on a
  # machine other than the author's. What is here is the self test, and it is here because this
  # gate's failure mode is not a red build. An assertion that is quietly vacuous passes forever and
  # reads on the page exactly like one that is doing something, so half of these cases are about
  # refusing output that does not hold, since only those can tell the two apart.
  asserts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet run --project tools/xray -- assert --selftest

  # Two claims hold this repository up. No number in a lesson is typed by a person, and no table in
  # a blueprint is transcribed by one. Both are enforced the same way, by regenerating the file and
  # comparing it against what is committed, so both are exactly as true as that comparison is. This
  # job goes and hand edits the generated files on purpose and requires the build to object to each
  # one by name. Three of its sixteen cases expect a green build, because a harness that failed on
  # everything would otherwise report a clean sweep.
  tamper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet run --project tools/xray -- check --selftest

  # A cold machine is not a slower warm machine, it is a different machine. Every other job here
  # starts from a runner image with an SDK on it, a NuGet folder, a home directory and a package
  # manager that has already been used. A reader starts from none of that, and so does a container.
  # This job takes all of it away on all four platforms and runs the gates again.
  #
  # It has found three things a warm run cannot. A bare Ubuntu image cannot start .NET at all until
  # libicu is installed, which dotnet-install.sh says it will not do for you. global.json names
  # 10.0.100 but rolls forward, so every machine anybody had used resolved a 10.0.4xx, and the two
  # feature bands disagree about the working directory of a file run with dotnet run. And the
  # regeneration self test was copying a lesson without the two Directory.Build.props files above
  # it, so it had been building its cases with the SDK's settings rather than this repository's.
  #
  # The steps are the same script the fleet and a reader can run, rather than a copy of it kept in
  # a YAML file where nobody would notice it drifting.
  cold:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # No setup-dotnet in this job, on purpose. It is the one step every other job starts with and
      # the one thing a cold machine does not have.
      #
      # The Linux legs run in a bare ubuntu:24.04 with the checkout mounted read only, so the
      # container has to install everything down to ca-certificates, and cannot quietly write build
      # output back into the checkout. The other two are the same script with no container: Windows
      # containers are a whole operating system image rather than a directory tree, and the macOS
      # runners cannot run containers at all. On those two the cold part is an empty HOME,
      # DOTNET_ROOT, NuGet folder and artifact cache, and a path with no dotnet on it.
      - if: runner.os == 'Linux'
        run: docker run --rm -v "$PWD:/src:ro" ubuntu:24.04 bash /src/docs/probes/cold-start.sh /src
      - if: runner.os == 'macOS'
        run: bash docs/probes/cold-start.sh
      - if: runner.os == 'Windows'
        run: pwsh -File docs/probes/cold-start.ps1

  # The pin moves to .NET 11 at general availability on 10 November 2026. Until then this job
  # answers, on every pull request, whether the tooling still builds on the preview it is going
  # to be pinned to. It is allowed to fail, because a broken preview is not a broken repository.
  preview:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview
      # global.json is what makes everybody else see the same compiler, so it has to go for the
      # one job whose entire purpose is to use a different one. Removing it here rather than
      # loosening it there keeps the pin honest for every other job and for every reader.
      - run: rm global.json
      - run: dotnet --info
      - run: dotnet build ClrXray.slnx --configuration Release
