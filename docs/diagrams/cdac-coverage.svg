<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .heading { font-size: 15px; font-weight: 600; fill: #1e1e1e; }
    .body { font-size: 13px; fill: #495057; }
    .cell-heading { font-size: 13px; font-weight: 600; fill: #1e1e1e; }
    .cell-body { font-size: 11px; fill: #495057; }
    .title { font-size: 18px; font-weight: 700; fill: #1e1e1e; }
    .edge { font-size: 12px; fill: #495057; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    .footer { font-size: 11px; fill: #868e96; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#868e96"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text class="title" x="24" y="32">Where a blueprint section 2 gets its facts</text>
  <line x1="180" y1="200" x2="490" y2="280" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="490" y1="200" x2="490" y2="280" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="800" y1="200" x2="490" y2="280" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <rect x="40" y="90" width="280" height="110" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="180" y="132">the data descriptor</text>
  <text class="body" text-anchor="middle" x="180" y="152">200 types, 807 fields,</text>
  <text class="body" text-anchor="middle" x="180" y="169">real offsets, per build</text>
  <rect x="350" y="90" width="280" height="110" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="490" y="132">the globals table</text>
  <text class="body" text-anchor="middle" x="490" y="152">188 addresses and masks,</text>
  <text class="body" text-anchor="middle" x="490" y="169">including flag values</text>
  <rect x="660" y="90" width="280" height="110" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="800" y="132">35 contract specs</text>
  <text class="body" text-anchor="middle" x="800" y="152">prose and pseudocode</text>
  <text class="body" text-anchor="middle" x="800" y="169">for reading all of it</text>
  <rect x="350" y="280" width="280" height="110" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="490" y="322">blueprint section 2</text>
  <text class="body" text-anchor="middle" x="490" y="342">structures, sizes and</text>
  <text class="body" text-anchor="middle" x="490" y="359">invariants to build from</text>
  <rect x="660" y="280" width="280" height="110" rx="6" fill="#fff9db" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="body" text-anchor="middle" x="800" y="315">74 per cent of the names</text>
  <text class="body" text-anchor="middle" x="800" y="332">a blueprint needs are</text>
  <text class="body" text-anchor="middle" x="800" y="349">published. For the three</text>
  <text class="body" text-anchor="middle" x="800" y="366">betting on cDAC, 89.</text>
  <rect x="40" y="460" width="280" height="140" rx="6" fill="#fff9db" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="body" text-anchor="middle" x="180" y="501.5">Not published: the tail.</text>
  <text class="body" text-anchor="middle" x="180" y="518.5">Vtable slots, optional</text>
  <text class="body" text-anchor="middle" x="180" y="535.5">members and the generic</text>
  <text class="body" text-anchor="middle" x="180" y="552.5">dictionary sit past the</text>
  <text class="body" text-anchor="middle" x="180" y="569.5">fixed header.</text>
  <rect x="350" y="460" width="280" height="140" rx="6" fill="#fff9db" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="body" text-anchor="middle" x="490" y="501.5">Not published: policy.</text>
  <text class="body" text-anchor="middle" x="490" y="518.5">gc.cpp budgets, inlining</text>
  <text class="body" text-anchor="middle" x="490" y="535.5">decisions and the tier</text>
  <text class="body" text-anchor="middle" x="490" y="552.5">promotion thresholds are</text>
  <text class="body" text-anchor="middle" x="490" y="569.5">computed, not declared.</text>
  <rect x="660" y="460" width="280" height="140" rx="6" fill="#fff9db" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="body" text-anchor="middle" x="800" y="501.5">Not published: the JIT.</text>
  <text class="body" text-anchor="middle" x="800" y="518.5">GenTree, the flow graph</text>
  <text class="body" text-anchor="middle" x="800" y="535.5">and the phase list are</text>
  <text class="body" text-anchor="middle" x="800" y="552.5">compiler internals and</text>
  <text class="body" text-anchor="middle" x="800" y="569.5">never sit in a heap.</text>
  <text class="footer" x="24" y="626">Generated by xray from cdac-coverage.dg. Edit that file, not this one.</text>
</svg>
