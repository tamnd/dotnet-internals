<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .heading { font-size: 15px; font-weight: 600; fill: #1e1e1e; }
    .body { font-size: 13px; fill: #495057; }
    .cell-heading { font-size: 13px; font-weight: 600; fill: #1e1e1e; }
    .cell-body { font-size: 11px; fill: #495057; }
    .title { font-size: 18px; font-weight: 700; fill: #1e1e1e; }
    .edge { font-size: 12px; fill: #495057; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    .footer { font-size: 11px; fill: #868e96; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#868e96"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text class="title" x="24" y="32">What a lesson is allowed to need</text>
  <line x1="320" y1="135" x2="340" y2="135" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <text class="edge" text-anchor="middle" x="330" y="129">one download</text>
  <line x1="620" y1="135" x2="640" y2="135" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <text class="edge" text-anchor="middle" x="630" y="129">hours</text>
  <rect x="40" y="60" width="280" height="150" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="180" y="113.5">E0  the stock SDK</text>
  <text class="body" text-anchor="middle" x="180" y="133.5">One install, the way anybody</text>
  <text class="body" text-anchor="middle" x="180" y="150.5">installs it. Ninety six of the</text>
  <text class="body" text-anchor="middle" x="180" y="167.5">ninety nine lessons live here.</text>
  <rect x="340" y="60" width="280" height="150" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="480" y="96.5">E1  a checked JIT</text>
  <text class="body" text-anchor="middle" x="480" y="116.5">The release runtime with a</text>
  <text class="body" text-anchor="middle" x="480" y="133.5">checked clrjit dropped in beside</text>
  <text class="body" text-anchor="middle" x="480" y="150.5">it, chosen with DOTNET_JitName.</text>
  <text class="body" text-anchor="middle" x="480" y="167.5">One download, and then</text>
  <text class="body" text-anchor="middle" x="480" y="184.5">DOTNET_JitDump works.</text>
  <rect x="640" y="60" width="280" height="150" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="780" y="105">E2  built from source</text>
  <text class="body" text-anchor="middle" x="780" y="125">A clone of dotnet/runtime at the</text>
  <text class="body" text-anchor="middle" x="780" y="142">pinned commit, built. Hours and</text>
  <text class="body" text-anchor="middle" x="780" y="159">tens of gigabytes of disk. One</text>
  <text class="body" text-anchor="middle" x="780" y="176">lesson out of the ninety nine.</text>
  <rect x="40" y="250" width="420" height="170" rx="6" fill="#fff9db" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="body" text-anchor="middle" x="250" y="289.5">A block says which rung it needs, and</text>
  <text class="body" text-anchor="middle" x="250" y="306.5">the tool reads that now. Before, every</text>
  <text class="body" text-anchor="middle" x="250" y="323.5">block said E0 and nothing looked, so</text>
  <text class="body" text-anchor="middle" x="250" y="340.5">the first block to say E1 would have</text>
  <text class="body" text-anchor="middle" x="250" y="357.5">run under E0 anyway and the page would</text>
  <text class="body" text-anchor="middle" x="250" y="374.5">have quoted the wrong runtime while</text>
  <text class="body" text-anchor="middle" x="250" y="391.5">saying it had not.</text>
  <rect x="500" y="250" width="420" height="170" rx="6" fill="#fff9db" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="body" text-anchor="middle" x="710" y="289.5">A machine without a rung skips the</text>
  <text class="body" text-anchor="middle" x="710" y="306.5">lessons that need it, by name, and</text>
  <text class="body" text-anchor="middle" x="710" y="323.5">produces nothing for them. The skip is</text>
  <text class="body" text-anchor="middle" x="710" y="340.5">allowed only when the page is already</text>
  <text class="body" text-anchor="middle" x="710" y="357.5">committed, so a missing environment</text>
  <text class="body" text-anchor="middle" x="710" y="374.5">cannot be the reason a lesson nobody</text>
  <text class="body" text-anchor="middle" x="710" y="391.5">has ever built looks fine.</text>
  <text class="footer" x="24" y="446">Generated by xray from environment-ladder.dg. Edit that file, not this one.</text>
</svg>
