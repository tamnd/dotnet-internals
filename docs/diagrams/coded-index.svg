<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .heading { font-size: 15px; font-weight: 600; fill: #1e1e1e; }
    .body { font-size: 13px; fill: #495057; }
    .cell-heading { font-size: 13px; font-weight: 600; fill: #1e1e1e; }
    .cell-body { font-size: 11px; fill: #495057; }
    .title { font-size: 18px; font-weight: 700; fill: #1e1e1e; }
    .edge { font-size: 12px; fill: #495057; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    .footer { font-size: 11px; fill: #868e96; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#868e96"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text class="title" x="24" y="32">How one value names a table and a row</text>
  <line x1="300" y1="140" x2="340" y2="140" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="700" y1="140" x2="740" y2="140" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="840" y1="190" x2="510" y2="290" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="430" y1="190" x2="510" y2="290" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <rect x="40" y="90" width="260" height="100" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="170" y="127">A MemberRefParent column</text>
  <text class="body" text-anchor="middle" x="170" y="147">holding 17</text>
  <text class="body" text-anchor="middle" x="170" y="164">in two bytes</text>
  <rect x="340" y="90" width="180" height="100" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="430" y="136">row 2</text>
  <text class="cell-body" text-anchor="middle" x="430" y="153">17 shifted right by 3</text>
  <rect x="520" y="90" width="180" height="100" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="610" y="136">tag 1</text>
  <text class="cell-body" text-anchor="middle" x="610" y="153">the low 3 bits</text>
  <rect x="740" y="90" width="200" height="100" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="840" y="135.5">tag 1 is TypeRef</text>
  <text class="body" text-anchor="middle" x="840" y="155.5">the tag list is fixed</text>
  <rect x="340" y="290" width="340" height="100" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="510" y="335.5">Row 2 of TypeRef</text>
  <text class="body" text-anchor="middle" x="510" y="355.5">which is where this column points</text>
  <rect x="40" y="440" width="900" height="120" rx="6" fill="#fff9db" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="body" text-anchor="middle" x="490" y="488.5">MemberRefParent can name five tables, so the tag needs three bits and the row number gets thirteen.</text>
  <text class="body" text-anchor="middle" x="490" y="505.5">Assume the wrong number of tag bits and you read a plausible row from a plausible table.</text>
  <text class="body" text-anchor="middle" x="490" y="522.5">Nothing in the value says which coded index it is. The column it sits in is what decides that.</text>
  <text class="footer" x="24" y="606">Generated by xray from coded-index.dg. Edit that file, not this one.</text>
</svg>
