<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="700" viewBox="0 0 1140 700">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .heading { font-size: 15px; font-weight: 600; fill: #1e1e1e; }
    .body { font-size: 13px; fill: #495057; }
    .cell-heading { font-size: 13px; font-weight: 600; fill: #1e1e1e; }
    .cell-body { font-size: 11px; fill: #495057; }
    .title { font-size: 18px; font-weight: 700; fill: #1e1e1e; }
    .edge { font-size: 12px; fill: #495057; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    .footer { font-size: 11px; fill: #868e96; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#868e96"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text class="title" x="24" y="32">Why the middle language is a stack machine</text>
  <rect x="40" y="90" width="320" height="150" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="200" y="152">What you wrote</text>
  <text class="body" text-anchor="middle" x="200" y="172">public override double</text>
  <text class="body" text-anchor="middle" x="200" y="189">Area() =&gt; side * side;</text>
  <rect x="400" y="90" width="240" height="150" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="520" y="153.5">ldarg.0</text>
  <text class="cell-body" text-anchor="middle" x="520" y="170.5">ldfld &lt;side&gt;P</text>
  <text class="cell-body" text-anchor="middle" x="520" y="185.5">put a value on the stack</text>
  <rect x="640" y="90" width="240" height="150" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="760" y="153.5">ldarg.0</text>
  <text class="cell-body" text-anchor="middle" x="760" y="170.5">ldfld &lt;side&gt;P</text>
  <text class="cell-body" text-anchor="middle" x="760" y="185.5">put another one on</text>
  <rect x="880" y="90" width="240" height="150" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="1000" y="153.5">mul</text>
  <text class="cell-body" text-anchor="middle" x="1000" y="170.5">take two off the top</text>
  <text class="cell-body" text-anchor="middle" x="1000" y="185.5">and put one back</text>
  <rect x="40" y="300" width="500" height="190" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="290" y="356.5">What a processor wants</text>
  <text class="body" text-anchor="middle" x="290" y="376.5">Registers, with names, picked before</text>
  <text class="body" text-anchor="middle" x="290" y="393.5">anything runs. One machine has one set</text>
  <text class="body" text-anchor="middle" x="290" y="410.5">of them, the next has a different set</text>
  <text class="body" text-anchor="middle" x="290" y="427.5">and a different number, and the right</text>
  <text class="body" text-anchor="middle" x="290" y="444.5">choice depends on what else is live.</text>
  <rect x="580" y="300" width="520" height="190" rx="6" fill="#fff9db" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="body" text-anchor="middle" x="840" y="358">So the middle language does not pick. It says what the</text>
  <text class="body" text-anchor="middle" x="840" y="375">program means using a stack that no hardware has, and</text>
  <text class="body" text-anchor="middle" x="840" y="392">leaves the question of where a value lives until the</text>
  <text class="body" text-anchor="middle" x="840" y="409">machine is known. That happens in T05, every time the</text>
  <text class="body" text-anchor="middle" x="840" y="426">method is first called. It is also why one file runs on</text>
  <text class="body" text-anchor="middle" x="840" y="443">a laptop and on a phone with nothing rebuilt.</text>
  <rect x="40" y="540" width="1060" height="130" rx="6" fill="#fff9db" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="body" text-anchor="middle" x="570" y="585">The stack buys one more thing. How deep it is at every instruction can be worked out</text>
  <text class="body" text-anchor="middle" x="570" y="602">without running the program, and a method whose stack does not come out even is refused</text>
  <text class="body" text-anchor="middle" x="570" y="619">before it runs. That is what makes it safe to load code that this runtime did not build,</text>
  <text class="body" text-anchor="middle" x="570" y="636">and it is a large part of why the format could be written down and standardised at all.</text>
  <text class="footer" x="24" y="686">Generated by xray from evaluation-stack.dg. Edit that file, not this one.</text>
</svg>
