<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .heading { font-size: 15px; font-weight: 600; fill: #1e1e1e; }
    .body { font-size: 13px; fill: #495057; }
    .cell-heading { font-size: 13px; font-weight: 600; fill: #1e1e1e; }
    .cell-body { font-size: 11px; fill: #495057; }
    .title { font-size: 18px; font-weight: 700; fill: #1e1e1e; }
    .edge { font-size: 12px; fill: #495057; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    .footer { font-size: 11px; fill: #868e96; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#868e96"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text class="title" x="24" y="32">How a blueprint is put together</text>
  <line x1="180" y1="170" x2="490" y2="230" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="490" y1="170" x2="490" y2="230" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="800" y1="170" x2="490" y2="230" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="490" y1="320" x2="180" y2="390" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="490" y1="320" x2="490" y2="390" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <rect x="40" y="70" width="280" height="100" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="180" y="107">generate.cs</text>
  <text class="body" text-anchor="middle" x="180" y="127">a program whose output</text>
  <text class="body" text-anchor="middle" x="180" y="144">is markdown, not numbers</text>
  <rect x="350" y="70" width="280" height="100" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="490" y="107">blueprint.src.md</text>
  <text class="body" text-anchor="middle" x="490" y="127">the sections a person writes,</text>
  <text class="body" text-anchor="middle" x="490" y="144">with holes in them</text>
  <rect x="660" y="70" width="280" height="100" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="800" y="107">blueprint.json</text>
  <text class="body" text-anchor="middle" x="800" y="127">id, status, and the</text>
  <text class="body" text-anchor="middle" x="800" y="144">list of sources</text>
  <rect x="350" y="230" width="280" height="90" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="490" y="270.5">xray build blueprints</text>
  <text class="body" text-anchor="middle" x="490" y="290.5">runs it, then fills the holes</text>
  <rect x="40" y="390" width="280" height="100" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="180" y="427">generated/*.md</text>
  <text class="body" text-anchor="middle" x="180" y="447">committed, and compared</text>
  <text class="body" text-anchor="middle" x="180" y="464">on every pull request</text>
  <rect x="350" y="390" width="280" height="100" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="490" y="427">blueprint.md</text>
  <text class="body" text-anchor="middle" x="490" y="447">the document, front matter</text>
  <text class="body" text-anchor="middle" x="490" y="464">and header included</text>
  <rect x="660" y="390" width="280" height="100" rx="6" fill="#fff9db" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="body" text-anchor="middle" x="800" y="428.5">xray check blueprints</text>
  <text class="body" text-anchor="middle" x="800" y="445.5">the same code with one flag</text>
  <text class="body" text-anchor="middle" x="800" y="462.5">flipped, so a stale file fails</text>
  <text class="footer" x="24" y="606">Generated by xray from blueprint-generation.dg. Edit that file, not this one.</text>
</svg>
