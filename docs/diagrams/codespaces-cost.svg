<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .heading { font-size: 15px; font-weight: 600; fill: #1e1e1e; }
    .body { font-size: 13px; fill: #495057; }
    .cell-heading { font-size: 13px; font-weight: 600; fill: #1e1e1e; }
    .cell-body { font-size: 11px; fill: #495057; }
    .title { font-size: 18px; font-weight: 700; fill: #1e1e1e; }
    .edge { font-size: 12px; fill: #495057; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    .footer { font-size: 11px; fill: #868e96; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#868e96"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text class="title" x="24" y="32">Where a reader's first minute goes</text>
  <line x1="375" y1="260" x2="432.5" y2="290" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <text class="edge" text-anchor="middle" x="403.75" y="269">the same clock</text>
  <rect x="40" y="70" width="920" height="60" rx="6" fill="#fff9db" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="body" text-anchor="middle" x="500" y="97">Measured on a 4 core runner at load 0.09, not on a Codespace.</text>
  <text class="body" text-anchor="middle" x="500" y="114">The two boxes with a question mark are GitHub's and were not measured.</text>
  <rect x="40" y="170" width="200" height="90" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="140" y="202">what the repo</text>
  <text class="body" text-anchor="middle" x="140" y="222">controls</text>
  <text class="body" text-anchor="middle" x="140" y="239">measured</text>
  <rect x="260" y="170" width="230" height="90" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="375" y="211">container start</text>
  <text class="cell-body" text-anchor="middle" x="375" y="228">0.19 s</text>
  <rect x="490" y="170" width="230" height="90" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="605" y="211">first build</text>
  <text class="cell-body" text-anchor="middle" x="605" y="228">4.5 s</text>
  <rect x="720" y="170" width="230" height="90" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="835" y="211">every build after</text>
  <text class="cell-body" text-anchor="middle" x="835" y="228">1.8 s</text>
  <rect x="40" y="290" width="200" height="90" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="140" y="322">what GitHub</text>
  <text class="body" text-anchor="middle" x="140" y="342">controls</text>
  <text class="body" text-anchor="middle" x="140" y="359">not measured</text>
  <rect x="260" y="290" width="345" height="90" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="432.5" y="331">provision a VM</text>
  <text class="cell-body" text-anchor="middle" x="432.5" y="348">?</text>
  <rect x="605" y="290" width="345" height="90" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="777.5" y="331">pull 0.70 GB</text>
  <text class="cell-body" text-anchor="middle" x="777.5" y="348">?</text>
  <rect x="40" y="430" width="440" height="150" rx="6" fill="#fff9db" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="body" text-anchor="middle" x="260" y="468">The image is 1.7 GB unpacked</text>
  <text class="body" text-anchor="middle" x="260" y="485">and 0.70 GB compressed.</text>
  <text class="body" text-anchor="middle" x="260" y="502">0.60 GB of the unpacked size</text>
  <text class="body" text-anchor="middle" x="260" y="519">is the base image's git and</text>
  <text class="body" text-anchor="middle" x="260" y="536">common-utils features, which</text>
  <text class="body" text-anchor="middle" x="260" y="553">no lesson here touches.</text>
  <rect x="520" y="430" width="440" height="150" rx="6" fill="#fff9db" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="body" text-anchor="middle" x="740" y="468">The same image on a plain</text>
  <text class="body" text-anchor="middle" x="740" y="485">ubuntu base is 1.2 GB and</text>
  <text class="body" text-anchor="middle" x="740" y="502">0.50 GB compressed, in 10</text>
  <text class="body" text-anchor="middle" x="740" y="519">layers rather than 17, and</text>
  <text class="body" text-anchor="middle" x="740" y="536">it still produces a JitDump.</text>
  <text class="body" text-anchor="middle" x="740" y="553">Not shipped yet, see the page.</text>
  <rect x="40" y="610" width="920" height="90" rx="6" fill="#fff9db" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="body" text-anchor="middle" x="500" y="643.5">Cost to the project: 51 s of runner time to rebuild the image from nothing, 0 s when nothing changed.</text>
  <text class="body" text-anchor="middle" x="500" y="660.5">Cost to a reader: 2 hours a day for thirty days fits in the free allowance on a 2 core machine.</text>
  <text class="body" text-anchor="middle" x="500" y="677.5">The pilot lesson runs in 11.8 s once the container is up, and that is the number a lesson page inherits.</text>
  <text class="footer" x="24" y="706">Generated by xray from codespaces-cost.dg. Edit that file, not this one.</text>
</svg>
