<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .heading { font-size: 15px; font-weight: 600; fill: #1e1e1e; }
    .body { font-size: 13px; fill: #495057; }
    .cell-heading { font-size: 13px; font-weight: 600; fill: #1e1e1e; }
    .cell-body { font-size: 11px; fill: #495057; }
    .title { font-size: 18px; font-weight: 700; fill: #1e1e1e; }
    .edge { font-size: 12px; fill: #495057; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    .footer { font-size: 11px; fill: #868e96; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#868e96"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text class="title" x="24" y="32">What is checked about what a block printed</text>
  <line x1="500" y1="140" x2="260" y2="190" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <text class="edge" text-anchor="middle" x="380" y="159">pinned</text>
  <line x1="500" y1="140" x2="740" y2="190" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <text class="edge" text-anchor="middle" x="620" y="159">not pinned</text>
  <line x1="740" y1="330" x2="740" y2="390" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <text class="edge" text-anchor="middle" x="740" y="354">still checked</text>
  <rect x="280" y="60" width="440" height="80" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="500" y="87">One block, one run</text>
  <text class="body" text-anchor="middle" x="500" y="107">It printed something. Here is what</text>
  <text class="body" text-anchor="middle" x="500" y="124">the build does with it.</text>
  <rect x="40" y="190" width="440" height="140" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="260" y="230">capture=stdout</text>
  <text class="body" text-anchor="middle" x="260" y="250">The output goes into expected/&lt;id&gt;.txt</text>
  <text class="body" text-anchor="middle" x="260" y="267">and the page quotes it. One changed</text>
  <text class="body" text-anchor="middle" x="260" y="284">byte fails the build, on all four</text>
  <text class="body" text-anchor="middle" x="260" y="301">platforms.</text>
  <rect x="520" y="190" width="440" height="140" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="740" y="230">capture=drop</text>
  <text class="body" text-anchor="middle" x="740" y="250">The output goes nowhere. It differs</text>
  <text class="body" text-anchor="middle" x="740" y="267">on every machine, so the page is</text>
  <text class="body" text-anchor="middle" x="740" y="284">not allowed to quote it. So what is</text>
  <text class="body" text-anchor="middle" x="740" y="301">left to check?</text>
  <rect x="40" y="390" width="440" height="170" rx="6" fill="#fff9db" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="body" text-anchor="middle" x="260" y="429.5">The rule with teeth, over on the</text>
  <text class="body" text-anchor="middle" x="260" y="446.5">right hand side: a dropped block</text>
  <text class="body" text-anchor="middle" x="260" y="463.5">with nothing asserted about it is</text>
  <text class="body" text-anchor="middle" x="260" y="480.5">refused. It was the one place in a</text>
  <text class="body" text-anchor="middle" x="260" y="497.5">lesson where a program could print</text>
  <text class="body" text-anchor="middle" x="260" y="514.5">anything at all, or stop printing,</text>
  <text class="body" text-anchor="middle" x="260" y="531.5">and nobody would find out.</text>
  <rect x="520" y="390" width="440" height="170" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="740" y="436.5">asserts.json, which is the answer</text>
  <text class="body" text-anchor="middle" x="740" y="456.5">This many lines. Contains this.</text>
  <text class="body" text-anchor="middle" x="740" y="473.5">Does not contain that. A line</text>
  <text class="body" text-anchor="middle" x="740" y="490.5">matching this pattern. Each one</text>
  <text class="body" text-anchor="middle" x="740" y="507.5">with a reason, checked everywhere,</text>
  <text class="body" text-anchor="middle" x="740" y="524.5">and printed onto the page.</text>
  <text class="footer" x="24" y="576">Generated by xray from assertions.dg. Edit that file, not this one.</text>
</svg>
