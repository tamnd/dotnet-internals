<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .heading { font-size: 15px; font-weight: 600; fill: #1e1e1e; }
    .body { font-size: 13px; fill: #495057; }
    .cell-heading { font-size: 13px; font-weight: 600; fill: #1e1e1e; }
    .cell-body { font-size: 11px; fill: #495057; }
    .title { font-size: 18px; font-weight: 700; fill: #1e1e1e; }
    .edge { font-size: 12px; fill: #495057; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    .footer { font-size: 11px; fill: #868e96; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#868e96"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text class="title" x="24" y="32">The word before an object, on two runtimes</text>
  <line x1="535" y1="260" x2="365" y2="290" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <text class="edge" text-anchor="middle" x="450" y="269">the type pointer</text>
  <rect x="40" y="70" width="920" height="60" rx="6" fill="#fff9db" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="body" text-anchor="middle" x="500" y="97">object boxed = new Point { X = 0x11111111, Y = 0x22222222 };</text>
  <text class="body" text-anchor="middle" x="500" y="114">Column 0 is where AddrOfPinnedObject points.</text>
  <rect x="40" y="170" width="220" height="90" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="150" y="202">osx-arm64</text>
  <text class="body" text-anchor="middle" x="150" y="222">CoreCLR</text>
  <text class="body" text-anchor="middle" x="150" y="239">eight byte words</text>
  <rect x="280" y="170" width="170" height="90" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="365" y="203.5">-16</text>
  <text class="cell-body" text-anchor="middle" x="365" y="220.5">sync block</text>
  <text class="cell-body" text-anchor="middle" x="365" y="235.5">0x0</text>
  <rect x="450" y="170" width="170" height="90" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="535" y="203.5">-8</text>
  <text class="cell-body" text-anchor="middle" x="535" y="220.5">MethodTable</text>
  <text class="cell-body" text-anchor="middle" x="535" y="235.5">0x301b41280</text>
  <rect x="620" y="170" width="170" height="90" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="705" y="203.5">0</text>
  <text class="cell-body" text-anchor="middle" x="705" y="220.5">X and Y</text>
  <text class="cell-body" text-anchor="middle" x="705" y="235.5">packed</text>
  <rect x="790" y="170" width="170" height="90" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="875" y="203.5">+8</text>
  <text class="cell-body" text-anchor="middle" x="875" y="220.5">padding</text>
  <text class="cell-body" text-anchor="middle" x="875" y="235.5">0x0</text>
  <rect x="40" y="290" width="220" height="90" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="150" y="322">browser-wasm</text>
  <text class="body" text-anchor="middle" x="150" y="342">Mono</text>
  <text class="body" text-anchor="middle" x="150" y="359">four byte words</text>
  <rect x="280" y="290" width="170" height="90" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="365" y="323.5">-8</text>
  <text class="cell-body" text-anchor="middle" x="365" y="340.5">MonoVTable</text>
  <text class="cell-body" text-anchor="middle" x="365" y="355.5">0x2f5e180</text>
  <rect x="450" y="290" width="170" height="90" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="535" y="323.5">-4</text>
  <text class="cell-body" text-anchor="middle" x="535" y="340.5">monitor</text>
  <text class="cell-body" text-anchor="middle" x="535" y="355.5">0x0</text>
  <rect x="620" y="290" width="170" height="90" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="705" y="323.5">0</text>
  <text class="cell-body" text-anchor="middle" x="705" y="340.5">X</text>
  <text class="cell-body" text-anchor="middle" x="705" y="355.5">0x11111111</text>
  <rect x="790" y="290" width="170" height="90" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="875" y="323.5">+4</text>
  <text class="cell-body" text-anchor="middle" x="875" y="340.5">Y</text>
  <text class="cell-body" text-anchor="middle" x="875" y="355.5">0x22222222</text>
  <rect x="40" y="430" width="440" height="130" rx="6" fill="#fff9db" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="body" text-anchor="middle" x="260" y="466.5">The code reads one pointer</text>
  <text class="body" text-anchor="middle" x="260" y="483.5">back from the data. On</text>
  <text class="body" text-anchor="middle" x="260" y="500.5">CoreCLR that is the</text>
  <text class="body" text-anchor="middle" x="260" y="517.5">MethodTable, which is what</text>
  <text class="body" text-anchor="middle" x="260" y="534.5">a layout lesson wants.</text>
  <rect x="520" y="430" width="440" height="130" rx="6" fill="#fff9db" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="body" text-anchor="middle" x="740" y="466.5">Mono puts the same pointer</text>
  <text class="body" text-anchor="middle" x="740" y="483.5">one slot earlier. One back</text>
  <text class="body" text-anchor="middle" x="740" y="500.5">is the monitor slot, and</text>
  <text class="body" text-anchor="middle" x="740" y="517.5">it reads as zero. Nothing</text>
  <text class="body" text-anchor="middle" x="740" y="534.5">throws.</text>
  <rect x="40" y="590" width="920" height="90" rx="6" fill="#fff9db" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="body" text-anchor="middle" x="500" y="623.5">51 checks in the page. 2 throw. 49 return a value.</text>
  <text class="body" text-anchor="middle" x="500" y="640.5">16 of the 49 describe the browser, not the runtime the book teaches.</text>
  <text class="body" text-anchor="middle" x="500" y="657.5">Four of those are silent: this read, GC.Collect, a finalizer, a listener.</text>
  <text class="footer" x="24" y="686">Generated by xray from browser-tier.dg. Edit that file, not this one.</text>
</svg>
