<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" viewBox="0 0 980 720">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .heading { font-size: 15px; font-weight: 600; fill: #1e1e1e; }
    .body { font-size: 13px; fill: #495057; }
    .cell-heading { font-size: 13px; font-weight: 600; fill: #1e1e1e; }
    .cell-body { font-size: 11px; fill: #495057; }
    .title { font-size: 18px; font-weight: 700; fill: #1e1e1e; }
    .edge { font-size: 12px; fill: #495057; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    .footer { font-size: 11px; fill: #868e96; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#868e96"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text class="title" x="24" y="32">What a metadata row actually holds</text>
  <line x1="565" y1="160" x2="310" y2="300" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="715" y1="160" x2="670" y2="300" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="490" y1="470" x2="490" y2="410" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <rect x="40" y="70" width="150" height="90" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="115" y="111">RVA</text>
  <text class="cell-body" text-anchor="middle" x="115" y="128">where the IL is</text>
  <rect x="190" y="70" width="150" height="90" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="265" y="111">ImplFlags</text>
  <text class="cell-body" text-anchor="middle" x="265" y="128">2 bytes</text>
  <rect x="340" y="70" width="150" height="90" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="415" y="111">Flags</text>
  <text class="cell-body" text-anchor="middle" x="415" y="128">2 bytes</text>
  <rect x="490" y="70" width="150" height="90" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="565" y="111">Name</text>
  <text class="cell-body" text-anchor="middle" x="565" y="128">an offset</text>
  <rect x="640" y="70" width="150" height="90" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="715" y="111">Signature</text>
  <text class="cell-body" text-anchor="middle" x="715" y="128">an offset</text>
  <rect x="790" y="70" width="150" height="90" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="865" y="111">ParamList</text>
  <text class="cell-body" text-anchor="middle" x="865" y="128">a row number</text>
  <rect x="40" y="300" width="180" height="110" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="130" y="343.5">#~</text>
  <text class="cell-body" text-anchor="middle" x="130" y="360.5">the tables</text>
  <text class="cell-body" text-anchor="middle" x="130" y="375.5">fixed width rows</text>
  <rect x="220" y="300" width="180" height="110" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="310" y="343.5">#Strings</text>
  <text class="cell-body" text-anchor="middle" x="310" y="360.5">names</text>
  <text class="cell-body" text-anchor="middle" x="310" y="375.5">UTF-8, null ended</text>
  <rect x="400" y="300" width="180" height="110" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="490" y="343.5">#US</text>
  <text class="cell-body" text-anchor="middle" x="490" y="360.5">your literals</text>
  <text class="cell-body" text-anchor="middle" x="490" y="375.5">UTF-16, length first</text>
  <rect x="580" y="300" width="180" height="110" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="670" y="343.5">#Blob</text>
  <text class="cell-body" text-anchor="middle" x="670" y="360.5">signatures</text>
  <text class="cell-body" text-anchor="middle" x="670" y="375.5">length first</text>
  <rect x="760" y="300" width="180" height="110" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="850" y="343.5">#GUID</text>
  <text class="cell-body" text-anchor="middle" x="850" y="360.5">16 bytes each</text>
  <text class="cell-body" text-anchor="middle" x="850" y="375.5">counts from 1</text>
  <rect x="380" y="470" width="220" height="80" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="490" y="497">ldstr 0x70000001</text>
  <text class="body" text-anchor="middle" x="490" y="517">an instruction reaches this</text>
  <text class="body" text-anchor="middle" x="490" y="534">heap, no row does</text>
  <rect x="40" y="600" width="900" height="70" rx="6" fill="#fff9db" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="body" text-anchor="middle" x="490" y="632">A row has to be a fixed width, because finding row 400 has to be arithmetic rather than a search.</text>
  <text class="body" text-anchor="middle" x="490" y="649">So a row holds numbers, and everything that varies in length lives in a heap with a number pointing at it.</text>
  <text class="footer" x="24" y="706">Generated by xray from metadata-streams.dg. Edit that file, not this one.</text>
</svg>
