  <text class="cell-heading" text-anchor="middle" x="700" y="186">75</text>
  <text class="cell-body" text-anchor="middle" x="700" y="203">u</text>
  <rect x="744" y="155" width="88" height="70" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="788" y="186">65</text>
  <text class="cell-body" text-anchor="middle" x="788" y="203">e</text>
