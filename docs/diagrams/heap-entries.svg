  <text class="cell-heading" text-anchor="middle" x="260" y="186">74</text>
  <text class="cell-body" text-anchor="middle" x="260" y="203">t</text>
  <rect x="304" y="155" width="88" height="70" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="348" y="186">61</text>
  <text class="cell-body" text-anchor="middle" x="348" y="203">a</text>
  <rect x="392" y="155" width="88" height="70" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="436" y="186">6C</text>
  <text class="cell-body" text-anchor="middle" x="436" y="203">l</text>
  <rect x="480" y="155" width="88" height="70" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="524" y="186">6F</text>
  <text class="cell-body" text-anchor="middle" x="524" y="203">o</text>
  <rect x="568" y="155" width="88" height="70" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="612" y="186">67</text>
  <text class="cell-body" text-anchor="middle" x="612" y="203">g</text>
