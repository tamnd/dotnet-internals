  <text class="cell-heading" text-anchor="middle" x="876" y="186">00</text>
  <text class="cell-body" text-anchor="middle" x="876" y="203">the end</text>
  <rect x="40" y="285" width="320" height="60" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="200" y="310.5">#US holds heap</text>
  <text class="body" text-anchor="middle" x="200" y="330.5">UTF-16, and the length comes first</text>
  <rect x="40" y="370" width="145" height="70" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="112.5" y="401">09</text>
  <text class="cell-body" text-anchor="middle" x="112.5" y="418">the length</text>
  <rect x="185" y="370" width="145" height="70" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="257.5" y="401">68 00</text>
  <text class="cell-body" text-anchor="middle" x="257.5" y="418">h</text>
  <rect x="330" y="370" width="145" height="70" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="402.5" y="401">65 00</text>
  <text class="cell-body" text-anchor="middle" x="402.5" y="418">e</text>
  <rect x="475" y="370" width="145" height="70" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="547.5" y="401">61 00</text>
  <text class="cell-body" text-anchor="middle" x="547.5" y="418">a</text>
  <rect x="620" y="370" width="145" height="70" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="692.5" y="401">70 00</text>
  <text class="cell-body" text-anchor="middle" x="692.5" y="418">p</text>
  <rect x="765" y="370" width="145" height="70" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="837.5" y="401">00</text>
  <text class="cell-body" text-anchor="middle" x="837.5" y="418">flag byte</text>
  <rect x="40" y="480" width="900" height="70" rx="6" fill="#fff9db" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="body" text-anchor="middle" x="490" y="512">The 9 counts the bytes after it, which is four characters at two bytes each plus the flag byte.</text>
  <text class="body" text-anchor="middle" x="490" y="529">So a string of n characters stores 2n plus 1, and the flag says whether any character needs more than a byte.</text>
  <text class="footer" x="24" y="586">Generated by xray from heap-entries.dg. Edit that file, not this one.</text>
