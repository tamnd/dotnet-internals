<svg xmlns="http://www.w3.org/2000/svg" width="980" height="660" viewBox="0 0 980 660">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .heading { font-size: 15px; font-weight: 600; fill: #1e1e1e; }
    .body { font-size: 13px; fill: #495057; }
    .cell-heading { font-size: 13px; font-weight: 600; fill: #1e1e1e; }
    .cell-body { font-size: 11px; fill: #495057; }
    .title { font-size: 18px; font-weight: 700; fill: #1e1e1e; }
    .edge { font-size: 12px; fill: #495057; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    .footer { font-size: 11px; fill: #868e96; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#868e96"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text class="title" x="24" y="32">How a boss fight is graded</text>
  <line x1="300" y1="120" x2="360" y2="120" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="620" y1="120" x2="680" y2="120" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="810" y1="170" x2="530" y2="240" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <text class="edge" text-anchor="middle" x="670" y="199">compared against</text>
  <line x1="300" y1="290" x2="400" y2="290" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="530" y1="340" x2="530" y2="400" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="400" y1="450" x2="300" y2="290" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <text class="edge" text-anchor="middle" x="350" y="364">go again</text>
  <rect x="40" y="70" width="260" height="100" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="170" y="107">boss.json</text>
  <text class="body" text-anchor="middle" x="170" y="127">the title, the brief and</text>
  <text class="body" text-anchor="middle" x="170" y="144">the answers, named</text>
  <rect x="360" y="70" width="260" height="100" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="490" y="107">solution.cs</text>
  <text class="body" text-anchor="middle" x="490" y="127">the worked answer, run on</text>
  <text class="body" text-anchor="middle" x="490" y="144">every build</text>
  <rect x="680" y="70" width="260" height="100" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="810" y="107">answers.txt</text>
  <text class="body" text-anchor="middle" x="810" y="127">one hash per answer,</text>
  <text class="body" text-anchor="middle" x="810" y="144">generated, never typed</text>
  <rect x="40" y="240" width="260" height="100" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="170" y="277">boss.cs</text>
  <text class="body" text-anchor="middle" x="170" y="297">yours. print one line</text>
  <text class="body" text-anchor="middle" x="170" y="314">per answer and run it</text>
  <rect x="400" y="240" width="260" height="100" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="530" y="277">xray boss</text>
  <text class="body" text-anchor="middle" x="530" y="297">runs your file, hashes</text>
  <text class="body" text-anchor="middle" x="530" y="314">what it printed, compares</text>
  <rect x="400" y="400" width="260" height="100" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="530" y="437">what you get back</text>
  <text class="body" text-anchor="middle" x="530" y="457">which answers are wrong</text>
  <text class="body" text-anchor="middle" x="530" y="474">and what you printed</text>
  <rect x="40" y="530" width="900" height="70" rx="6" fill="#fff9db" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="body" text-anchor="middle" x="490" y="562">The build runs boss.cs too and requires it to fail. A file that already passes is a fight with nothing in it,</text>
  <text class="body" text-anchor="middle" x="490" y="579">and that happens when a later edit to the solution quietly makes the stub right. A green build looks the same.</text>
  <text class="footer" x="24" y="646">Generated by xray from boss-fight.dg. Edit that file, not this one.</text>
</svg>
