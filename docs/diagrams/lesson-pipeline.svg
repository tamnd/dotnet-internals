<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .heading { font-size: 15px; font-weight: 600; fill: #1e1e1e; }
    .body { font-size: 13px; fill: #495057; }
    .cell-heading { font-size: 13px; font-weight: 600; fill: #1e1e1e; }
    .cell-body { font-size: 11px; fill: #495057; }
    .title { font-size: 18px; font-weight: 700; fill: #1e1e1e; }
    .edge { font-size: 12px; fill: #495057; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    .footer { font-size: 11px; fill: #868e96; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#868e96"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text class="title" x="24" y="32">How a lesson becomes a page</text>
  <line x1="170" y1="170" x2="490" y2="250" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="480" y1="170" x2="490" y2="250" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="800" y1="170" x2="490" y2="250" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="490" y1="340" x2="170" y2="430" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="490" y1="340" x2="480" y2="430" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="490" y1="340" x2="800" y2="430" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <rect x="40" y="60" width="260" height="110" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="170" y="102">lesson.cs</text>
  <text class="body" text-anchor="middle" x="170" y="122">one program, with named</text>
  <text class="body" text-anchor="middle" x="170" y="139">regions in it called blocks</text>
  <rect x="330" y="60" width="300" height="110" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="480" y="102">lesson.src.md</text>
  <text class="body" text-anchor="middle" x="480" y="122">prose with holes in it, where</text>
  <text class="body" text-anchor="middle" x="480" y="139">the code and the output go</text>
  <rect x="660" y="60" width="280" height="110" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="800" y="102">gates.json</text>
  <text class="body" text-anchor="middle" x="800" y="122">the question asked before</text>
  <text class="body" text-anchor="middle" x="800" y="139">the answer is shown</text>
  <rect x="320" y="250" width="340" height="90" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="490" y="282">xray build</text>
  <text class="body" text-anchor="middle" x="490" y="302">runs the program once, then cuts</text>
  <text class="body" text-anchor="middle" x="490" y="319">the output at the markers</text>
  <rect x="40" y="250" width="240" height="90" rx="6" fill="#fff9db" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="body" text-anchor="middle" x="160" y="283.5">xray check</text>
  <text class="body" text-anchor="middle" x="160" y="300.5">the same code, one flag,</text>
  <text class="body" text-anchor="middle" x="160" y="317.5">fails on a stale file</text>
  <rect x="40" y="430" width="260" height="100" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="170" y="467">expected/*.txt</text>
  <text class="body" text-anchor="middle" x="170" y="487">what each block printed,</text>
  <text class="body" text-anchor="middle" x="170" y="504">one file per block</text>
  <rect x="330" y="430" width="300" height="100" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="480" y="467">lesson.md</text>
  <text class="body" text-anchor="middle" x="480" y="487">the page a reader opens</text>
  <text class="body" text-anchor="middle" x="480" y="504">and never edits</text>
  <rect x="660" y="430" width="280" height="100" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="800" y="467">diagram.svg</text>
  <text class="body" text-anchor="middle" x="800" y="487">the picture, generated</text>
  <text class="body" text-anchor="middle" x="800" y="504">from a .dg file</text>
  <rect x="40" y="555" width="900" height="44" rx="6" fill="#fff9db" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="body" text-anchor="middle" x="490" y="582.5">The top row is written by a person. The bottom row is produced. No file is both.</text>
  <text class="footer" x="24" y="626">Generated by xray from lesson-pipeline.dg. Edit that file, not this one.</text>
</svg>
