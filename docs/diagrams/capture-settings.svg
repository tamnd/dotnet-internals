<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .heading { font-size: 15px; font-weight: 600; fill: #1e1e1e; }
    .body { font-size: 13px; fill: #495057; }
    .cell-heading { font-size: 13px; font-weight: 600; fill: #1e1e1e; }
    .cell-body { font-size: 11px; fill: #495057; }
    .title { font-size: 18px; font-weight: 700; fill: #1e1e1e; }
    .edge { font-size: 12px; fill: #495057; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    .footer { font-size: 11px; fill: #868e96; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#868e96"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text class="title" x="24" y="32">The three capture settings</text>
  <rect x="60" y="80" width="260" height="120" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="190" y="128.5">capture=stdout</text>
  <text class="cell-body" text-anchor="middle" x="190" y="145.5">stored on disk</text>
  <text class="cell-body" text-anchor="middle" x="190" y="160.5">the page may quote it</text>
  <rect x="320" y="80" width="260" height="120" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="450" y="128.5">capture=drop</text>
  <text class="cell-body" text-anchor="middle" x="450" y="145.5">runs, then discarded</text>
  <text class="cell-body" text-anchor="middle" x="450" y="160.5">for output that varies</text>
  <rect x="580" y="80" width="260" height="120" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="cell-heading" text-anchor="middle" x="710" y="128.5">capture=none</text>
  <text class="cell-body" text-anchor="middle" x="710" y="145.5">no marker at all</text>
  <text class="cell-body" text-anchor="middle" x="710" y="160.5">for a block holding a type</text>
  <rect x="60" y="240" width="780" height="60" rx="6" fill="#fff9db" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="body" text-anchor="middle" x="450" y="267">A marker is a statement, and a statement cannot come after a declaration</text>
  <text class="body" text-anchor="middle" x="450" y="284">in a file of top level statements. That is the only reason the third setting exists.</text>
  <text class="footer" x="24" y="326">Generated by xray from capture-settings.dg. Edit that file, not this one.</text>
</svg>
