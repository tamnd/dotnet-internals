<svg xmlns="http://www.w3.org/2000/svg" width="980" height="570" viewBox="0 0 980 570">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .heading { font-size: 15px; font-weight: 600; fill: #1e1e1e; }
    .body { font-size: 13px; fill: #495057; }
    .cell-heading { font-size: 13px; font-weight: 600; fill: #1e1e1e; }
    .cell-body { font-size: 11px; fill: #495057; }
    .title { font-size: 18px; font-weight: 700; fill: #1e1e1e; }
    .edge { font-size: 12px; fill: #495057; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    .footer { font-size: 11px; fill: #868e96; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#868e96"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text class="title" x="24" y="32">Swapping the JIT under a runtime you did not build</text>
  <line x1="300" y1="120" x2="350" y2="120" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="490" y1="170" x2="170" y2="240" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="490" y1="170" x2="490" y2="240" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="680" y1="295" x2="630" y2="295" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="490" y1="350" x2="490" y2="430" stroke="#868e96" stroke-width="1.5" marker-end="url(#head)"/>
  <rect x="40" y="70" width="260" height="100" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="170" y="107">your app</text>
  <text class="body" text-anchor="middle" x="170" y="127">an ordinary dll, built</text>
  <text class="body" text-anchor="middle" x="170" y="144">by an ordinary SDK</text>
  <rect x="350" y="70" width="280" height="100" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="490" y="107">stock release runtime</text>
  <text class="body" text-anchor="middle" x="490" y="127">installed with one command,</text>
  <text class="body" text-anchor="middle" x="490" y="144">nothing built from source</text>
  <rect x="40" y="240" width="260" height="110" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="170" y="282">libclrjit, shipped</text>
  <text class="body" text-anchor="middle" x="170" y="302">the release JIT, next to</text>
  <text class="body" text-anchor="middle" x="170" y="319">the runtime. No dump switches</text>
  <rect x="350" y="240" width="280" height="110" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="490" y="282">libclrjit_checked, added</text>
  <text class="body" text-anchor="middle" x="490" y="302">the checked JIT for the same</text>
  <text class="body" text-anchor="middle" x="490" y="319">release branch, one download</text>
  <rect x="680" y="240" width="260" height="110" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="810" y="282">DOTNET_JitName</text>
  <text class="body" text-anchor="middle" x="810" y="302">names the file to load,</text>
  <text class="body" text-anchor="middle" x="810" y="319">so nothing is overwritten</text>
  <rect x="350" y="430" width="280" height="100" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text class="heading" text-anchor="middle" x="490" y="467">DOTNET_JitDump works</text>
  <text class="body" text-anchor="middle" x="490" y="487">four thousand lines of phases</text>
  <text class="body" text-anchor="middle" x="490" y="504">for one named method</text>
  <rect x="680" y="430" width="260" height="100" rx="6" fill="#fff9db" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="body" text-anchor="middle" x="810" y="468.5">about twice the JIT time</text>
  <text class="body" text-anchor="middle" x="810" y="485.5">and no change to the code</text>
  <text class="body" text-anchor="middle" x="810" y="502.5">the JIT produces</text>
  <text class="footer" x="24" y="556">Generated by xray from checked-jit-swap.dg. Edit that file, not this one.</text>
</svg>
